  <style>
    :root {
      color-scheme: dark;
      --mbk-bg: #0e2b1a;
      --mbk-bg-soft: #123522;
      --mbk-bg-elev: #163a26;
      --mbk-fg: #f5f7f5;
      --mbk-muted: #d0ddd3;
      --mbk-dim: #9db8a8;
      --mbk-accent: #a8efc2;
      --mbk-accent-strong: #6fe39a;
      --mbk-border: rgba(168, 239, 194, 0.18);
      --mbk-radius: 14px;
      --mbk-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--mbk-bg);
      color: var(--mbk-fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Arabic", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      min-height: 100svh;
    }

    ::selection { background: var(--mbk-accent); color: #0e2b1a; }
    ::-moz-selection { background: var(--mbk-accent); color: #0e2b1a; }

    :focus-visible {
      outline: 2px solid var(--mbk-accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    a { color: var(--mbk-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    img, svg, video { max-width: 100%; height: auto; display: block; }

    /* ── Boot screen ── */
    .mbk-boot {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    .mbk-boot__mark {
      font-size: clamp(2.4rem, 10vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--mbk-accent);
      line-height: 1;
      text-shadow: 0 0 40px rgba(168, 239, 194, 0.35);
    }
    .mbk-boot__brand {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--mbk-muted);
    }
    .mbk-boot__tag {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      color: var(--mbk-dim);
      max-width: 320px;
    }
    .mbk-boot__bar {
      width: min(240px, 62vw);
      height: 3px;
      border-radius: 999px;
      background: rgba(168, 239, 194, 0.15);
      overflow: hidden;
    }
    .mbk-boot__bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mbk-accent), var(--mbk-accent-strong));
      animation: mbk-slide 1.15s ease-in-out infinite;
    }
    @keyframes mbk-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .mbk-boot__bar span { animation: none; width: 100%; }
    }

    /* ── No-JS / crawler fallback ── */
    .mbk-noscript {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 22px 96px;
      line-height: 1.8;
    }
    .mbk-noscript__eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mbk-accent);
      margin: 0 0 1rem;
      font-weight: 700;
    }
    .mbk-noscript h1 {
      font-size: clamp(1.9rem, 5.2vw, 3.2rem);
      line-height: 1.14;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .mbk-noscript h1 small {
      display: block;
      font-size: 0.42em;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mbk-accent);
      margin-bottom: 0.6rem;
    }
    .mbk-noscript h2 {
      margin: 2.6rem 0 0.8rem;
      color: var(--mbk-accent);
      font-size: 1.2rem;
      letter-spacing: 0.02em;
      font-weight: 700;
    }
    .mbk-noscript h3 {
      margin: 1.6rem 0 0.5rem;
      font-size: 1rem;
      color: var(--mbk-fg);
      font-weight: 700;
    }
    .mbk-noscript p,
    .mbk-noscript li { color: var(--mbk-muted); }
    .mbk-noscript ul { padding-left: 1.2rem; margin: 0.6rem 0 1rem; }
    .mbk-noscript li { margin-bottom: 0.4rem; }
    .mbk-noscript a { color: var(--mbk-accent); text-decoration: none; }
    .mbk-noscript a:hover { text-decoration: underline; }
    .mbk-noscript__card {
      background: var(--mbk-bg-soft);
      border: 1px solid var(--mbk-border);
      border-radius: var(--mbk-radius);
      padding: 1.1rem 1.3rem;
      margin: 1.2rem 0;
    }
    .mbk-noscript__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.7rem;
      margin: 1rem 0 0.4rem;
    }
    .mbk-noscript__chip {
      background: var(--mbk-bg-elev);
      border: 1px solid var(--mbk-border);
      border-radius: 999px;
      padding: 0.5rem 0.95rem;
      font-size: 0.86rem;
      color: var(--mbk-accent);
      text-align: center;
      letter-spacing: 0.02em;
      font-weight: 600;
    }

    /* ── Social links grid ── */
    .mbk-social {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.7rem;
      margin: 1rem 0 0.4rem;
    }
    .mbk-social a {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--mbk-bg-elev);
      border: 1px solid var(--mbk-border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      color: var(--mbk-fg);
      font-weight: 600;
      transition: border-color 0.2s ease, transform 0.2s ease;
      text-decoration: none;
    }
    .mbk-social a:hover {
      border-color: var(--mbk-accent);
      transform: translateY(-2px);
      text-decoration: none;
    }
    .mbk-social a span.mbk-social__icon {
      font-size: 1.05rem;
