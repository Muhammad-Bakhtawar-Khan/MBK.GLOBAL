    img, svg { max-width: 100%; height: auto; display: block; }

    .mbk-boot {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;

      font-size: clamp(2.4rem, 10vw, 4rem);

      text-shadow: 0 0 40px rgba(168, 239, 194, 0.35);

      font-size: 0.95rem;
      letter-spacing: 0.32em;

      font-size: 0.82rem;
      color: var(--mbk-dim);
      max-width: 320px;

      width: min(240px, 62vw);
      height: 3px;
      border-radius: 999px;
      background: rgba(168, 239, 194, 0.15);
      overflow: hidden;
    }
    .mbk-boot__bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mbk-accent), var(--mbk-accent-strong));
      animation: mbk-slide 1.15s ease-in-out infinite;
    }
    @keyframes mbk-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
